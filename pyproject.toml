[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jd-match"
version = "0.1.0"
description = "Compare a resume against a job description for keyword coverage and ATS issues."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "python-docx>=1.1",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
app = ["streamlit>=1.35"]




[project.scripts]
jd-match = "jd_match.cli:main"

[tool.setuptools.packages.find]
where = ["src"]


